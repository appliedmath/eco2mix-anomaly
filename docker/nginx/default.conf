# NGINX = the only container with ports open on the machine (single entry point).
# The URLs stay the same as before: the API on 8000, MLflow on 5000 and
# Airflow on 8080 now all go through NGINX; the services themselves are only
# reachable inside the compose network.

server_tokens off;                       # don't show the NGINX version

# POST /train and /predict start jobs: at most 6 per minute per client
# (+3 burst). More → 429 Too Many Requests, so nobody can flood Airflow.
limit_req_zone $binary_remote_addr zone=jobs:1m rate=6r/m;
limit_req_status 429;

# Docker's internal DNS. Names are resolved per request (variables in
# proxy_pass), so NGINX also starts when a service is still down (→ 502).
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------- API (FastAPI) ----------
server {
    listen 8000;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(train|predict)$ {
        limit_req zone=jobs burst=3 nodelay;
        set $api http://api:8000;
        proxy_pass $api;
    }

    location / {
        set $api http://api:8000;
        proxy_pass $api;
    }
}

# ---------- MLflow UI ----------
server {
    listen 5000;
    client_max_body_size 50m;

    proxy_set_header Host              $http_host;   # MLflow checks it (--allowed-hosts)
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        set $mlflow http://mlflow:5000;
        proxy_pass $mlflow;
    }
}

# ---------- Airflow UI and REST API ----------
server {
    listen 8080;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location / {
        set $airflow http://airflow-webserver:8080;
        proxy_pass $airflow;
    }
}
