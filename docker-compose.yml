# Services
#   mlflow  - tracking server (runs, metrics, model registry)
#   trainer - one-off job: collect -> process -> train, logs to MLflow
#             (profile "init": not started by a normal 'up')
#   api     - FastAPI, reads what the trainer wrote
#   airflow-* - orchestrator (Phase 3): batch_dag daily, retrain_dag weekly;
#               each task starts the trainer image through the Docker socket
#   nginx   - single entry point: the only service with open ports
#             (API :8000, MLflow :5000, Airflow :8080, Grafana :3000,
#              Prometheus :9090 on this machine only)
#   prometheus, node-exporter, grafana - monitoring (Phase 4)
# First time:        cp .env.example .env   (fill in the Airflow values)
#                    mkdir -p airflow/logs
# First training:    docker compose --profile init up trainer   (fresh setup only)
# Start everything:  docker compose up -d --build   (does not retrain)
# Airflow UI:        http://localhost:8080
# Retrain by hand:   docker compose run --rm trainer
#   (promote or reject: the new model replaces the old one only if not worse)
#   Worse model demo: docker compose run --rm trainer python -m src.models.train --k 2
# New data by hand:  docker compose run --rm batch      (next 7 days)

name: eco2mix-anomaly   # fixed project name -> network eco2mix-anomaly_default,
                        # image eco2mix-anomaly-trainer (used by the DAGs)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: eco2mix-anomaly-airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    BATCH_SOURCE: ${BATCH_SOURCE:-replay}   # default source of the scheduled batch_dag: live | replay
    HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR in .env}
    TRAINER_IMAGE: eco2mix-anomaly-trainer:latest
    COMPOSE_NETWORK: eco2mix-anomaly_default
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-0}"      # may use the Docker socket without chmod 777
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PORT:-5000},127.0.0.1,127.0.0.1:${MLFLOW_PORT:-5000}
      --workers 1
      --uvicorn-opts "--no-access-log"
    environment:
      - MLFLOW_DISABLE_TELEMETRY=true
    # no ports: reachable from your machine only through nginx (:5000)
    volumes:
      - ./mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  trainer:
    # One-off job, not part of the normal startup: retraining is Airflow's
    # job (retrain_dag weekly, POST /train) with promote-or-reject.
    # First training on a fresh setup: docker compose --profile init up trainer
    profiles: ["init"]
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_DISABLE_TELEMETRY=true
      - GIT_PYTHON_REFRESH=quiet
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mlflow:
        condition: service_healthy

  batch:
    # Not started by 'up': run it on demand (later: on a schedule)
    profiles: ["batch"]
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    command: ["sh", "batch.sh"]
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000   # predict loads @champion
      - MLFLOW_DISABLE_TELEMETRY=true
      - GIT_PYTHON_REFRESH=quiet
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      - MODEL_DIR=/app/models
      - DATA_PATH=/app/data/processed/consumption_30min.parquet
      # GET /champion asks the MLflow Model Registry for @champion
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # POST /train and /predict start Airflow DAG runs through its REST API
      - AIRFLOW_URL=http://airflow-webserver:8080
      - AIRFLOW_USER=${AIRFLOW_ADMIN_USER:-admin}
      - AIRFLOW_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-}
      # X-API-Key required on POST /train and /predict (empty = locked, 500)
      - API_KEY=${API_KEY:-}
    # no ports: reachable from your machine only through nginx (:8000)
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro

  # ---------- NGINX: single entry point (Phase 3) ----------
  # The only service with ports on your machine. Same URLs as before:
  # API :8000, MLflow :5000, Airflow :8080 (each port can be changed in .env).
  streamlit:
    # operator app (M4): talks only to the API, inside the compose network
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${API_PORT:-8000}:8000"
      - "${MLFLOW_PORT:-5000}:5000"
      - "${AIRFLOW_PORT:-8080}:8080"
      - "${GRAFANA_PORT:-3000}:3000"
      # Streamlit: the admin tab has no login, so only from this machine (like Prometheus)
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
      # Prometheus has no login: only reachable from this machine
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------- Monitoring (Phase 4) ----------
  # Prometheus scrapes the API's /metrics and node-exporter every 15 s and
  # evaluates the alert rules; Grafana shows dashboards from Prometheus.
  # Config and dashboards are files in monitoring/ (no clicking).
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    # no ports: reachable from this machine only through nginx (127.0.0.1:9090)
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node-exporter:
    # CPU, RAM, disk of the host (on Docker Desktop: the Docker VM)
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    # no ports: reachable from your machine only through nginx (:3000)
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Airflow (Phase 3) ----------
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    # One-off: create/upgrade Airflow's database, the admin user and the pool
    <<: *airflow-common
    command: ["airflow", "pools", "set", "models", "1", "One job at a time writes models/"]
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    # no ports: reachable from your machine only through nginx (:8080)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    environment:
      <<: *airflow-env
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
  prometheus-data:
  grafana-data:
