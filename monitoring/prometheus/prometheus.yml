# Prometheus: what to scrape and which alert rules to evaluate.
# Everything is inside the compose network (service names, internal ports).
global:
  scrape_interval: 15s        # read every target every 15 s (as in the course)
  evaluation_interval: 15s    # check the alert rules every 15 s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Our FastAPI: /metrics (requests, latency, model, data, batch quality, drift).
  # DNS service discovery instead of one fixed target: with
  # `docker compose up -d --scale api=3` every API container is scraped.
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 15s

  # Host metrics (CPU, RAM, disk). On Docker Desktop (WSL/macOS) this is the
  # Docker VM, not Windows/macOS itself.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Prometheus itself (is the monitoring healthy?)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
