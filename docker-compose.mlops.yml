services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow-server:
    image: python:3.12-slim
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - mlartifacts:/mlartifacts
    command: >
      sh -c "pip install --no-cache-dir mlflow psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5001
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination /mlartifacts --serve-artifacts"

  model-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - mlflow-server
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5001

volumes:
  pgdata:
  mlartifacts:
